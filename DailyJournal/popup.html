<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Daily Journal</title>
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <!-- HEADER -->
  <header class="app-header">
    <div class="header-left">
      <div class="app-logo">📖</div>
      <div class="header-titles">
        <h1 class="app-title" data-i18n="appTitle">Daily Journal</h1>
        <p class="app-subtitle" data-i18n="appSubtitle">Nhật Ký Cá Nhân</p>
      </div>
    </div>
    <div class="header-right">
      <!-- Language switcher -->
      <div class="lang-switcher" id="langSwitcher">
        <button class="lang-btn active" data-lang="vi">VI</button>
        <button class="lang-btn" data-lang="en">EN</button>
        <button class="lang-btn" data-lang="ja">JP</button>
      </div>
      <!-- Open Options (full screen) -->
      <button class="icon-btn" id="openOptions" title="Mở rộng toàn màn hình">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M8 3H5a2 2 0 0 0-2 2v3m18 0V5a2 2 0 0 0-2-2h-3m0 18h3a2 2 0 0 0 2-2v-3M3 16v3a2 2 0 0 0 2 2h3"/>
        </svg>
      </button>
    </div>
  </header>

  <!-- DATETIME DISPLAY -->
  <div class="datetime-bar">
    <span class="datetime-icon">🕐</span>
    <span id="currentDateTime" class="datetime-text">--</span>
    <span class="datetime-label" data-i18n="autoRecorded">Tự động ghi nhận</span>
  </div>

  <!-- TAB NAVIGATION -->
  <nav class="tab-nav">
    <button class="tab-btn active" data-tab="write" data-i18n="tabWrite">✏️ Viết</button>
    <button class="tab-btn" data-tab="list" data-i18n="tabList">📚 Nhật ký</button>
    <button class="tab-btn" data-tab="vocab" data-i18n="tabVocab">🗂️ Từ vựng</button>
  </nav>

  <!-- ===== TAB: WRITE ===== -->
  <section class="tab-content active" id="tab-write">
    <form id="journalForm" novalidate>

      <!-- TOPIC SELECTOR -->
      <div class="form-group">
        <label class="form-label" data-i18n="labelTopic">🏷️ Chủ đề</label>
        <div class="topic-container">
          <div class="topic-chips" id="topicChips">
            <!-- Generated by JS -->
          </div>
          <button type="button" class="add-topic-btn" id="addTopicBtn" data-i18n="addTopicBtn">+ Thêm chủ đề</button>
        </div>
        <div class="add-topic-form hidden" id="addTopicForm">
          <input type="text" id="newTopicInput" class="topic-input" maxlength="20" />
          <button type="button" id="confirmAddTopic" class="confirm-btn">✓</button>
          <button type="button" id="cancelAddTopic" class="cancel-btn">✕</button>
        </div>
      </div>

      <!-- JOURNAL CONTENT -->
      <div class="form-group">
        <label class="form-label" data-i18n="labelContent">📝 Nội dung</label>
        <textarea
          id="journalContent"
          class="journal-textarea"
          rows="7"
          data-i18n-placeholder="contentPlaceholder"
          placeholder="Hôm nay bạn đã làm gì? Cảm xúc thế nào?&#10;&#10;Bạn có thể dùng Markdown:&#10;**in đậm**, `code`, ```khối code```"
        ></textarea>
        <div class="char-counter"><span id="charCount">0</span> / 3000</div>
      </div>

      <!-- VOCAB SECTION (collapsible) -->
      <div class="form-group vocab-section">
        <button type="button" class="vocab-toggle" id="vocabToggle">
          <span data-i18n="vocabToggle">🌍 Từ vựng hôm nay</span>
          <span class="toggle-icon">▾</span>
        </button>
        <div class="vocab-inputs hidden" id="vocabInputs">
          <div class="vocab-row">
            <span class="vocab-flag">🇺🇸</span>
            <input type="text" id="vocabEn" class="vocab-input" maxlength="100"
              data-i18n-placeholder="vocabEnPlaceholder" placeholder="English word & meaning..." />
          </div>
          <div class="vocab-row">
            <span class="vocab-flag">🇯🇵</span>
            <input type="text" id="vocabJa" class="vocab-input" maxlength="100"
              data-i18n-placeholder="vocabJaPlaceholder" placeholder="日本語の単語・意味..." />
          </div>
        </div>
      </div>

      <!-- MOOD SELECTOR -->
      <div class="form-group">
        <label class="form-label" data-i18n="labelMood">😊 Tâm trạng</label>
        <div class="mood-selector" id="moodSelector">
          <button type="button" class="mood-btn" data-mood="great" title="Tuyệt vời">😄</button>
          <button type="button" class="mood-btn" data-mood="good" title="Tốt">🙂</button>
          <button type="button" class="mood-btn" data-mood="neutral" title="Bình thường">😐</button>
          <button type="button" class="mood-btn" data-mood="bad" title="Không tốt">😔</button>
          <button type="button" class="mood-btn" data-mood="terrible" title="Tệ">😢</button>
        </div>
      </div>

      <!-- SUBMIT BUTTON -->
      <div class="form-actions">
        <button type="submit" class="save-btn" id="saveBtn">
          <span class="btn-icon">💾</span>
          <span data-i18n="saveBtn">Lưu nhật ký</span>
        </button>
      </div>
    </form>

    <!-- SUCCESS TOAST -->
    <div class="toast hidden" id="toast">
      <span class="toast-icon">✅</span>
      <span class="toast-msg" data-i18n="saveSuccess">Đã lưu nhật ký thành công!</span>
    </div>
  </section>

  <!-- ===== TAB: LIST ===== -->
  <section class="tab-content hidden" id="tab-list">
    <!-- FILTER BAR -->
    <div class="filter-bar">
      <input type="search" id="searchInput" class="search-input"
        data-i18n-placeholder="searchPlaceholder" placeholder="🔍 Tìm kiếm..." />
      <select id="filterTopic" class="filter-select">
        <option value="" data-i18n="filterAll">Tất cả</option>
      </select>
      <input type="date" id="filterDate" class="filter-date" />
      <button type="button" id="clearFilters" class="clear-btn" data-i18n="clearFilter">✕</button>
    </div>

    <!-- ENTRY COUNT -->
    <div class="entry-meta">
      <span id="entryCount" class="entry-count">0</span>
      <span data-i18n="entries">mục nhật ký</span>
    </div>

    <!-- JOURNAL LIST -->
    <div class="journal-list" id="journalList">
      <div class="empty-state" id="emptyState">
        <div class="empty-icon">📭</div>
        <p data-i18n="emptyState">Chưa có nhật ký nào. Hãy bắt đầu viết!</p>
      </div>
    </div>
  </section>

  <!-- ===== TAB: VOCAB ===== -->
  <section class="tab-content hidden" id="tab-vocab">
    <div class="vocab-header">
      <h2 data-i18n="vocabTitle">🗂️ Bộ sưu tập từ vựng</h2>
      <p class="vocab-desc" data-i18n="vocabDesc">Tất cả từ vựng bạn đã ghi lại</p>
    </div>
    <div class="vocab-tabs">
      <button class="vtab-btn active" data-vtab="en">🇺🇸 English</button>
      <button class="vtab-btn" data-vtab="ja">🇯🇵 日本語</button>
    </div>
    <div id="vocabListEn" class="vocab-flashcards active-vtab"></div>
    <div id="vocabListJa" class="vocab-flashcards hidden-vtab"></div>
  </section>

  <!-- ENTRY DETAIL MODAL -->
  <div class="modal-overlay hidden" id="modalOverlay">
    <div class="modal" id="entryModal">
      <div class="modal-header">
        <div class="modal-meta">
          <span class="modal-topic" id="modalTopic"></span>
          <span class="modal-mood" id="modalMood"></span>
          <span class="modal-date" id="modalDate"></span>
        </div>
        <button class="modal-close" id="modalClose">✕</button>
      </div>
      <div class="modal-body">
        <div class="modal-content" id="modalContent"></div>
        <div class="modal-vocab" id="modalVocab"></div>
      </div>
      <div class="modal-footer">
        <button class="delete-btn" id="deleteEntryBtn" data-i18n="deleteBtn">🗑️ Xóa</button>
      </div>
    </div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
